[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytetra-downlink"
version = "1.0.0"
description = "Python 3 decoder for ETSI TETRA downlink protocol layers"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-2.0-only"}
authors = [
  {name = "Timothée Cocault"},
  {name = "PyTetra contributors"},
]
keywords = ["TETRA", "radio", "decoder", "MAC", "LLC", "MLE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Communications :: Ham Radio",
]

[project.scripts]
pytetra-dump = "pytetra.cli:main"

[tool.setuptools.packages.find]
include = ["pytetra*"]

[tool.setuptools]
zip-safe = false
